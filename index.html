<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVE</title>
<style>
html,body{margin:0;padding:0;background:#ffffff;color:#111111;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.logo{font-size:56px;letter-spacing:.18em;font-weight:300;}
.meta{margin-top:14px;font-size:12px;color:#888888;letter-spacing:.06em;}
#probe{margin-top:22px;font-size:12px;color:#aaaaaa;font-family:monospace;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">AVE</div>
  <div class="meta">deployed 2026-10-30</div>
  <div id="probe"></div>
</div>
<script>
(function(){
  function render(){
    try{
      var m = window.main;
      var h = (typeof m === 'object' && m !== null) || typeof m === 'function';
      var s = h ? (typeof m.appSign) : 'n/a';
      document.getElementById('probe').textContent = 'main:' + (h ? 'object' : typeof m) + '|appSign:' + s;
    }catch(e){
      document.getElementById('probe').textContent = 'probe-error';
    }
  }
  if (window.addEventListener) { window.addEventListener('load', render, false); }
  else if (window.attachEvent) { window.attachEvent('onload', render); }
  else { setTimeout(render, 500); }
})();
</script>
</body>
</html>
